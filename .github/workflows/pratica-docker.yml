name: Prática 04 Ciclo de Vida Docker

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  executar-pratica:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Executar as quatro ações
        run: bash scripts/run-all.sh

      - name: Publicar resumo dos resultados
        if: always()
        run: |
          {
            echo "## Prática 04 - Resultados"
            echo
            echo "### Ciclo de vida"
            echo '```text'
            cat evidencias/12-events.txt 2>/dev/null || true
            echo '```'
            echo
            echo "### Logs do Nginx"
            echo '```text'
            cat evidencias/14-last-5-logs.txt 2>/dev/null || true
            echo '```'
            echo
            echo "### Máximos antes da carga"
            echo '```text'
            cat evidencias/22-maximos-baseline.txt 2>/dev/null || true
            echo '```'
            echo
            echo "### Máximos durante a carga"
            echo '```text'
            cat evidencias/25-maximos-during-load.txt 2>/dev/null || true
            echo '```'
            echo
            echo "### Remoção automática"
            echo '```text'
            cat evidencias/34-confirm-auto-remove.txt 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Salvar evidências
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-pratica-04
          path: evidencias/
          if-no-files-found: warn

